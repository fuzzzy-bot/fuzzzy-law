# The law data pipeline: download laws from matsne.gov.ge, parse them into
# articles, build the article store, earlier wordings and the court store.
# Daily refresh packages: requirements-refresh.txt. Court collection and
# development tools: requirements-dev.txt.
[project]
name = "fuzzzy-law-data"
version = "1.1.0"
description = "Data pipeline for the Fuzzzy Law connector"
requires-python = ">=3.11"
license = "MIT"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# The parser and scripts keep matsne's long Georgian patterns on one line.
ignore = ["E501", "E741"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
