name: "შეცდომა · Bug"
description: "სერვისი ან ვებგვერდი არ მუშაობს როგორც უნდა · The service or the website misbehaves"
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: "რა მოხდა? · What happened?"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "რას ელოდი? · What did you expect?"
  - type: input
    id: assistant
    attributes:
      label: "რომელი ასისტენტი ან აპი? · Which assistant or app?"
      placeholder: "Claude, ChatGPT, Gemini CLI, ..."
  - type: textarea
    id: steps
    attributes:
      label: "როგორ გავიმეორო? · How can we reproduce it?"
