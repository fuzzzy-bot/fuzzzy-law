version: 2
# Minor and patch updates come grouped; each major update comes on its own, for a closer look.
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      connector-packages:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /law_corpus
    schedule:
      interval: weekly
    groups:
      pipeline-packages:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directories:
      - /backend
      - /law_corpus
    schedule:
      interval: weekly
    ignore:
      # The images stay on Python 3.11 until the code is tested on a newer one.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
